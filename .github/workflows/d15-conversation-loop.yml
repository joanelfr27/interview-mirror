name: D15 Conversational Mirror Loop
on:
  push:
    branches: [d15-v11-development-run]
    paths: [.github/workflows/d15-conversation-loop.yml]
permissions:
  contents: read
concurrency:
  group: d15-conversation-loop-once
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: e1-runtime
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 4ba6918be053bd847ea39cef1b8dcc0e5da29aab
          fetch-depth: 0
          persist-credentials: false
      - name: Assert pinned loop and evidence definition
        run: |
          test "$(git rev-parse HEAD)" = "4ba6918be053bd847ea39cef1b8dcc0e5da29aab"
          test "$(git hash-object docs/d15-semantic-significance-codebook-v1.1-candidate.md)" = "56f753c50e50aeb8532d7e7a70eeea04f0e69255"
          test "$(git hash-object scripts/d15-conversation-loop.ts)" = "e2c6b82ff4ad87f50dec3b14d65df05dc1dfc4c7"
          test "$(git hash-object src/lib/canonical-shadow-extractor.ts)" = "4d2ba2ffcc9cad8cba4c68b7c55bedb7a3225a4c"
          test "$(git hash-object src/lib/d15-conversational-mirror.ts)" = "330e396b4ad5ef21e517f085afc90ef3e2d2ec52"
          test "$(git hash-object src/lib/d15-clarification-state.ts)" = "1713dbd2513efbd8effe6c941025bcc00d21a089"
          {
            echo "engine_commit=4ba6918be053bd847ea39cef1b8dcc0e5da29aab"
            echo "workflow_definition_commit=${{ github.sha }}"
            echo "codebook_blob=56f753c50e50aeb8532d7e7a70eeea04f0e69255"
            echo "erratum_blob=5f888c661a5c4b9efa17724066b0785c3080be3d"
            echo "loop_definition_blob=e2c6b82ff4ad87f50dec3b14d65df05dc1dfc4c7"
            echo "E1_extractor_blob=4d2ba2ffcc9cad8cba4c68b7c55bedb7a3225a4c"
            echo "conversation_state_blob=1713dbd2513efbd8effe6c941025bcc00d21a089"
            echo "answer_loop_blob=330e396b4ad5ef21e517f085afc90ef3e2d2ec52"
            echo "product_decision_blob=858455d1e05920c621317b1b5d3886718a99db38"
            echo "mode=DEVELOPMENT_ONLY_SIMULATED_ANSWERS_NOT_QUALIFICATION"
            echo "cutover=false; database_writes=false"
          } | tee provenance.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Pre-spend canonical checks
        run: npm run test:canonical
      - name: Run five simulated answers with subject and lifecycle coverage
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node --experimental-loader ./tests/real-runtime-loader.mjs scripts/d15-conversation-loop.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d15-conversation-loop-${{ github.run_id }}
          retention-days: 3
          path: |
            provenance.txt
            d15-conversation-loop-report.json
