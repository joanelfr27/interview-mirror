name: D15 Conversational Mirror Loop
on:
  push:
    branches: [d15-v11-development-run]
    paths: [.github/workflows/d15-conversation-loop.yml]
permissions:
  contents: read
concurrency:
  group: d15-conversation-loop-once
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: e1-runtime
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cfdc42911204517d7b081201b9ca3605290db686
          fetch-depth: 0
          persist-credentials: false
      - name: Assert pinned loop and evidence definition
        run: |
          test "$(git rev-parse HEAD)" = "cfdc42911204517d7b081201b9ca3605290db686"
          test "$(git hash-object docs/d15-semantic-significance-codebook-v1.1-candidate.md)" = "56f753c50e50aeb8532d7e7a70eeea04f0e69255"
          test "$(git hash-object scripts/d15-conversation-loop.ts)" = "2c956423ac0502280d8507b9a42095e623dbbbbb"
          test "$(git hash-object src/lib/canonical-shadow-extractor.ts)" = "22ebb0bda8a2360f3173fdfd3cbdc1a668747d95"
          test "$(git hash-object src/lib/d15-conversational-mirror.ts)" = "354b641adfc34711cdc4ab3491127cbc472f0566"
          {
            echo "engine_commit=cfdc42911204517d7b081201b9ca3605290db686"
            echo "workflow_definition_commit=${{ github.sha }}"
            echo "codebook_blob=56f753c50e50aeb8532d7e7a70eeea04f0e69255"
            echo "erratum_blob=5f888c661a5c4b9efa17724066b0785c3080be3d"
            echo "loop_definition_blob=2c956423ac0502280d8507b9a42095e623dbbbbb"
            echo "E1_extractor_blob=22ebb0bda8a2360f3173fdfd3cbdc1a668747d95"
            echo "answer_loop_blob=354b641adfc34711cdc4ab3491127cbc472f0566"
            echo "product_decision_blob=cae8f90b33a2f68339f2c36e479007f843602e30"
            echo "mode=DEVELOPMENT_ONLY_SIMULATED_ANSWERS_NOT_QUALIFICATION"
            echo "cutover=false; database_writes=false"
          } | tee provenance.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Pre-spend canonical checks
        run: npm run test:canonical
      - name: Run three simulated answers against one frozen proposition
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node --experimental-loader ./tests/real-runtime-loader.mjs scripts/d15-conversation-loop.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d15-conversation-loop-${{ github.run_id }}
          retention-days: 3
          path: |
            provenance.txt
            d15-conversation-loop-report.json
