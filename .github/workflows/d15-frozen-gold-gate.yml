name: D15 Frozen Gold Gate

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact frozen replay SHA"
        required: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    environment: e1-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - name: Assert frozen checkout and scorer identity
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "expected=${{ inputs.expected_sha }}"
          echo "actual=$actual"
          test "$actual" = "${{ inputs.expected_sha }}"
          scorer="$(git hash-object src/lib/d15-gold-gate.ts)"
          echo "scorer_blob=$scorer"
          test "$scorer" = "38a51a9a6667283d545e87f36610dfda7e130cf2"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Gold synthetic tests
        run: node --experimental-loader ./tests/ts-alias-loader.mjs --test tests/d15-gold-gate.test.ts
      - name: Deterministic saved replay
        env:
          D15_REPLAY_DETERMINISTIC_ONLY: "1"
        run: npm run replay:d15:saved
