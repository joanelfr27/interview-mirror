name: JD Stability Offline Controls

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact trusted measurement ref"
        required: true
        default: "eea32992409dddb6a7425a8a3f2dadb11f3c97e8"

permissions:
  contents: read

jobs:
  offline-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Record exact measurement SHA
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "${{ inputs.ref }}"
      - name: Typecheck
        run: npm run typecheck
      - name: Full canonical suite
        run: npm run test:canonical
      - name: Production extractor import and combining-mark smoke
        run: node --experimental-loader ./tests/ts-alias-loader.mjs --test tests/ownership-prompt-regression.test.ts
      - name: Build
        run: npm run build
      - name: Run A1 A2 B offline controls
        run: npm run test:jd-stability-capture
