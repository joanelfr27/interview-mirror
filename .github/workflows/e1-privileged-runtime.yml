name: E1 Privileged Runtime Validation

on:
  push:
    branches: [jd-stability-measurement-fix]
  workflow_dispatch:
    inputs:
      ref:
        description: "Trusted ref to validate after environment approval"
        required: true
        default: ""
      session_count:
        description: "Number of runtime sessions to validate"
        required: true
        default: "1"
      session_fingerprints:
        description: "Optional comma-separated session fingerprints to validate"
        required: false
        default: "8a05fcb6dbe3"
      status_filter:
        description: "Optional session status filter"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  runtime:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-edf-decisive]')
    runs-on: ubuntu-latest
    environment: e1-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Verify immutable runtime commit and EDF session
        shell: bash
        run: |
          [[ "${{ inputs.ref || github.sha }}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${{ inputs.ref || github.sha }}"
          test "${{ inputs.session_fingerprints || '8a05fcb6dbe3' }}" = "8a05fcb6dbe3"
          echo "E1_TRUSTED_RUNTIME_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "runtime_commit=$(git rev-parse HEAD)"
          echo "runtime_session_fingerprint=${{ inputs.session_fingerprints || '8a05fcb6dbe3' }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:canonical
      - run: npm run build
      - name: Verify and load frozen context gold
        shell: bash
        run: |
          GOLD_PATH="validation/gold/edf-e1-context-gold-2026-10-03.json"
          EXPECTED_BLOB="cd9eb4795421d26350e7a43969f784624f74cd0c"
          test -s "$GOLD_PATH"
          ACTUAL_BLOB="$(git hash-object "$GOLD_PATH")"
          echo "context_gold_path=$GOLD_PATH"
          echo "context_gold_blob_sha=$ACTUAL_BLOB"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"
          {
            echo 'E1_CONTEXT_GOLD_JSON<<__E1_CONTEXT_GOLD__'
            cat "$GOLD_PATH"
            echo '__E1_CONTEXT_GOLD__'
          } >> "$GITHUB_ENV"
      - name: Verify and load frozen context policy
        shell: bash
        run: |
          POLICY_PATH="validation/gold/edf-e1-context-policy-2026-10-03.json"
          EXPECTED_POLICY_BLOB="62eb2aa3503e0d44c32f75dd03f046041cb548ca"
          test -s "$POLICY_PATH"
          ACTUAL_POLICY_BLOB="$(git hash-object "$POLICY_PATH")"
          echo "context_policy_path=$POLICY_PATH"
          echo "context_policy_blob_sha=$ACTUAL_POLICY_BLOB"
          test "$ACTUAL_POLICY_BLOB" = "$EXPECTED_POLICY_BLOB"
          {
            echo 'E1_CONTEXT_POLICY_JSON<<__E1_CONTEXT_POLICY__'
            cat "$POLICY_PATH"
            echo '__E1_CONTEXT_POLICY__'
          } >> "$GITHUB_ENV"
      - name: D15-D16 privileged runtime validation
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          D15_RUNTIME_SESSION_COUNT: ${{ inputs.session_count || '1' }}
          D15_RUNTIME_STATUS_FILTER: ${{ inputs.status_filter || '' }}
          D15_RUNTIME_SESSION_FINGERPRINTS: ${{ inputs.session_fingerprints || '8a05fcb6dbe3' }}
          D15_GOLD_DIAGNOSTICS: "true"
          E1_PROBE_DIAGNOSTICS: "true"
        run: node --experimental-loader ./tests/real-runtime-loader.mjs scripts/d15-real-session-shadow.ts
      - name: Verify D15-D16 runtime report exists
        if: always()
        run: test -s d15-real-session-shadow-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d15-d16-runtime-report-${{ github.run_id }}
          path: d15-real-session-shadow-report.json
          if-no-files-found: error
