name: D15 Explore Mirrors

on:
  workflow_dispatch:
    inputs:
      change_note:
        description: "One-line note describing this exploration iteration"
        required: false
        default: "explore baseline"

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-latest
    environment: e1-runtime
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Assert trusted frozen Gold scorer
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git hash-object src/lib/d15-gold-gate.ts)"
          expected="2304f2f4b0bc443e1732a12471a4521c795f138f"
          echo "Gold scorer blob: $actual"
          test_blob="$(git hash-object tests/d15-gold-gate.test.ts)"
          expected_test_blob="97435a5a7c2369158a58f01b3e4a54d3972bbdfd"
          echo "Gold test blob: $test_blob"
          test "$test_blob" = "$expected_test_blob"
          test "$actual" = "$expected"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pre-spend reject source encoding artifacts
        shell: bash
        run: |
          set -euo pipefail
          files=(scripts/*.ts src/lib/d15-*.ts)
          if grep -nE '[;){}]\\\\n' "${files[@]}"; then
            echo "Found literal \\n after code punctuation; replace it with a real line break."
            exit 1
          fi
          if LC_ALL=C grep -nP '[\\x{200B}\\x{200C}\\x{200D}\\x{FEFF}\\x{00A0}]' "${files[@]}"; then
            echo "Found forbidden invisible Unicode source character."
            exit 1
          fi
          echo "Raw harness line 49:"
          sed -n '49p' scripts/d15-explore.ts | od -An -tx1c

      - name: Pre-spend typecheck
        run: npm run typecheck

      - name: Pre-spend D15 engine and Gold regressions
        run: node --experimental-loader ./tests/ts-alias-loader.mjs --test tests/d15-semantic-thread-engine.test.ts tests/d15-gold-gate.test.ts

      - name: Print ten Mirrors and Gold scores
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHANGE_NOTE: ${{ inputs.change_note }}
        run: npm run explore:d15 -- "$CHANGE_NOTE"

      - name: Upload exploration output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d15-explore-${{ github.run_id }}
          path: tmp/d15-explore/*.txt
          if-no-files-found: warn
          retention-days: 14
