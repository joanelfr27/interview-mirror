name: D15 Explore Mirrors

on:
  workflow_dispatch:
    inputs:
      change_note:
        description: "One-line note describing this exploration iteration"
        required: false
        default: "explore baseline"

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-latest
    environment: e1-runtime
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Assert trusted frozen Gold scorer
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git hash-object src/lib/d15-gold-gate.ts)"
          expected="4eab933ad3a5c61e379d10b41ebbb360f791574e"
          echo "Gold scorer blob: $actual"
          test "$actual" = "$expected"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pre-spend typecheck
        run: npm run typecheck

      - name: Pre-spend D15 engine and Gold regressions
        run: node --experimental-loader ./tests/ts-alias-loader.mjs --test tests/d15-semantic-thread-engine.test.ts tests/d15-gold-gate.test.ts

      - name: Print ten Mirrors and Gold scores
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHANGE_NOTE: ${{ inputs.change_note }}
        run: npm run explore:d15 -- "$CHANGE_NOTE"

      - name: Upload exploration output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d15-explore-${{ github.run_id }}
          path: tmp/d15-explore/*.txt
          if-no-files-found: warn
          retention-days: 14
