name: D15 v1.1 Development Diagnostic
on:
  push:
    branches: [d15-v11-development-run]
    paths: [.github/workflows/d15-v11-development.yml]
permissions:
  contents: read
concurrency:
  group: d15-v11-development-once
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: e1-runtime
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 2bf6878b6ead26db3c4d7f3a7d52359cffa3bffa
          fetch-depth: 0
          persist-credentials: false
      - name: Assert pinned engine, codebook and development scorer
        run: |
          test "$(git rev-parse HEAD)" = "2bf6878b6ead26db3c4d7f3a7d52359cffa3bffa"
          test "$(git hash-object docs/d15-semantic-significance-codebook-v1.1-candidate.md)" = "56f753c50e50aeb8532d7e7a70eeea04f0e69255"
          test "$(git hash-object src/lib/d15-v11-development-scorer.ts)" = "c5ea8796c5a6a756ffc432767c01bd0038fb254a"
          {
            echo "engine_commit=2bf6878b6ead26db3c4d7f3a7d52359cffa3bffa"
            echo "workflow_definition_commit=${{ github.sha }}"
            echo "codebook_blob=56f753c50e50aeb8532d7e7a70eeea04f0e69255"
            echo "development_scorer_blob=c5ea8796c5a6a756ffc432767c01bd0038fb254a"
            echo "mode=DEVELOPMENT_ONLY_NOT_QUALIFICATION"
            echo "G_S=separate_independent_calls; model=existing_pinned_AI_MODEL; temperature=0"
            echo "cutover=false; database_writes=false"
          } | tee provenance.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Pre-spend invariant tests
        run: node --experimental-loader ./tests/ts-alias-loader.mjs --test tests/d15-gs-judges.test.ts
      - name: Run development diagnostic once
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node --experimental-loader ./tests/real-runtime-loader.mjs scripts/d15-v11-development.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d15-v11-development-${{ github.run_id }}
          retention-days: 3
          path: |
            provenance.txt
            d15-v11-development-report.json
