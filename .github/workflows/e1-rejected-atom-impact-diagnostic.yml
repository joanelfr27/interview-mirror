name: E1 Rejected Atom Impact Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    environment: e1-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d16-e1-impact-diagnostic
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Run impact diagnostic
        run: node --experimental-loader ./tests/ts-alias-loader.mjs scripts/e1-rejected-atom-impact-diagnostic.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Upload impact diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: e1-rejected-atom-impact-diagnostic
          path: e1-rejected-atom-impact-diagnostic-report.json
          retention-days: 1
