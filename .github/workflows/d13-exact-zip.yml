name: D13 Exact Audit ZIP

on:
  push:
    branches: ["d13-exact-zip"]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify corrected D13 commit is present
        run: git cat-file -e c0c15a264c6239f5da8e058934efc2bc4d553ffb^{commit}
      - name: Package exact corrected repository
        run: git archive --format=zip --output=Interview_Mirror_D13_Corrected_c0c15a2.zip c0c15a264c6239f5da8e058934efc2bc4d553ffb
      - uses: actions/upload-artifact@v4
        with:
          name: d13-exact-c0c15a2
          path: Interview_Mirror_D13_Corrected_c0c15a2.zip
          if-no-files-found: error
