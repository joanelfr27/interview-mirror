name: E1 Atom 6 Facet 4.2 Isolated Support Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    environment: e1-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d16-e1-atom6-facet4-2-diagnostic
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Run isolated support diagnostic
        run: node --experimental-loader ./tests/real-runtime-loader.mjs scripts/e1-atom6-facet4-2-isolated-support.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
      - name: Upload isolated support diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: e1-atom6-facet4-2-isolated-support
          path: e1-atom6-facet4-2-isolated-support-report.json
          retention-days: 1
