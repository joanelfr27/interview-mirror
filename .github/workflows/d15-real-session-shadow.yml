name: D15 Real Session Shadow Validation

on:
  pull_request:
    branches: ["audit-version"]

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --experimental-loader ./tests/real-runtime-loader.mjs scripts/d15-real-session-shadow.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d15-real-session-shadow-report
          path: d15-real-session-shadow-report.json
          if-no-files-found: warn
