name: D12 Full Audit Snapshot
on:
  push:
    branches: [d12-audit-pack-temp]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact D12 audited parent
        env:
          BASE_SHA: 4a53078525d7aabb808a1feff153ce7d533c8cf5
        run: |
          git archive --format=zip --output=/tmp/Interview_Mirror_D12_Full_Repository_4a530785.zip "$BASE_SHA"
      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Interview_Mirror_D12_Full_Repository_4a530785
          path: /tmp/Interview_Mirror_D12_Full_Repository_4a530785.zip
          retention-days: 7
